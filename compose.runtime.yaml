# Runtime time budgets shared by both hosts.
services:
  fixtures:
    environment:
      MODEL_UPSTREAM_TIMEOUT_SECONDS: '510'
  java:
    environment:
      LOOMSPAN_CONNECTIONS_MODEL_REQUESTTIMEOUT: 480s
      LOOMSPAN_SESSION_MISSIONTIMEOUT: 2400s
  sidecar:
    build: {context: ., dockerfile: deploy/sidecar.Dockerfile}
    environment:
      LOOMSPAN_CONNECTIONS_MODEL_REQUESTTIMEOUT: 480s
      LOOMSPAN_SESSION_MISSIONTIMEOUT: 2400s
