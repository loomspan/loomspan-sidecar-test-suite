# Explicit opt-in isolated step correction; no normal business workflow change.
services:
  java:
    environment:
      LOOMSPAN_SKILLS_LOCATIONS: file:/config/skills/*.yaml,file:/config/correction-diagnostic/*.yaml
    volumes:
      - ./config/correction-diagnostic:/config/correction-diagnostic:ro
  sidecar:
    environment:
      LOOMSPAN_SKILLS_LOCATIONS: file:/config/skills/*.yaml,file:/config/rest-skills/*.yaml,file:/config/correction-diagnostic/*.yaml
    volumes:
      - ./config/correction-diagnostic:/config/correction-diagnostic:ro
