name: assetContext
description: Retrieve registered asset identity, site access and approval-routing
  facts; directory facts never grant caller permissions.
rest: true
rbac_roles:
- ASSESS_EQUIPMENT
input_schema:
  type: object
  properties:
    caseId:
      type: string
      description: Case correlation identifier supplied by the caller.
    assetId:
      type: string
      description: Registered asset identifier; does not grant caller authority.
  required:
  - caseId
  - assetId
  additionalProperties: false
