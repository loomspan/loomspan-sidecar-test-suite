name: entitlements
description: Evaluate date eligibility and documented findings; model hypotheses are
  not findings.
rest: true
rbac_roles:
- ASSESS_EQUIPMENT
input_schema:
  type: object
  properties:
    caseId:
      type: string
      description: Case correlation identifier supplied by the caller.
    assetId:
      type: string
      description: Registered asset identifier; does not grant caller authority.
  required:
  - caseId
  - assetId
  additionalProperties: false
