name: createServiceRequest
description: Record explicit authorized approval against an immutable assessment and
  matching quote.
rest: true
rbac_roles:
- REQUEST_SERVICE
input_schema:
  type: object
  properties:
    approval:
      type: object
      description: Explicit caller approval bound to one immutable assessment and
        issued quote. Identity and spending authority are verified independently.
      properties:
        assessmentVersion:
          type: string
        option:
          type: string
        quoteId:
          type: string
        attendance:
          type: string
          description: The selected quote's offered technician arrival window, copied
            exactly for approval matching. Approval does not confirm dispatch or establish
            a visit-completion deadline.
        scope:
          type: object
          properties:
            parts:
              type: array
              items:
                type: string
            onlyIfJustifiedByTechnician:
              type: boolean
            repairHours:
              type: integer
          required:
          - parts
          - onlyIfJustifiedByTechnician
          - repairHours
          additionalProperties: false
        cap:
          type: integer
          description: Approved maximum in USD cents; must match the issued quote
            and caller ceiling.
        idempotencyKey:
          type: string
        approved:
          type: boolean
      required:
      - assessmentVersion
      - option
      - quoteId
      - attendance
      - scope
      - cap
      - idempotencyKey
      - approved
      additionalProperties: false
  required:
  - approval
  additionalProperties: false
