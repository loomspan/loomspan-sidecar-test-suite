name: serviceHistory
description: Retrieve versioned work orders, recurrence and maintenance observations.
rest: true
rbac_roles:
- ASSESS_EQUIPMENT
input_schema:
  type: object
  properties:
    caseId:
      type: string
    assetId:
      type: string
    context:
      type: object
      additionalProperties: true
  required:
  - caseId
  - assetId
