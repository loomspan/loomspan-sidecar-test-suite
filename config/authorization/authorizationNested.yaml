name: authorizationNested
description: Controlled nested authorization test; uses the real restricted business
  leaf.
model: reasoning
thinking_level: medium
rbac_roles:
- ASSESS_EQUIPMENT
planning_mode: true
max_steps: 3
allowed_skills:
- name: createServiceRequest
  required: false
  max_tasks: 1
input_schema:
  type: object
  properties:
    caseId:
      type: string
    approval:
      type: object
      description: Explicit caller approval bound to one immutable assessment and
        issued quote. Identity and spending authority are verified independently.
      properties:
        assessmentVersion:
          type: string
        option:
          type: string
        quoteId:
          type: string
        attendance:
          type: string
        scope:
          type: object
          properties:
            parts:
              type: array
              items:
                type: string
            onlyIfJustifiedByTechnician:
              type: boolean
            repairHours:
              type: integer
          required:
          - parts
          - onlyIfJustifiedByTechnician
          - repairHours
          additionalProperties: false
        cap:
          type: integer
          description: Approved maximum in USD cents; must match the issued quote
            and caller ceiling.
        idempotencyKey:
          type: string
        approved:
          type: boolean
      required:
      - assessmentVersion
      - option
      - quoteId
      - attendance
      - scope
      - cap
      - idempotencyKey
      - approved
      additionalProperties: false
  required:
  - caseId
  - approval
  additionalProperties: false
prompt: Controlled authorization scenario. Use the available capability to submit
  the supplied explicit approval unchanged. Preserve verified caller authority. Return
  the receipt unchanged. If creation is unavailable, report that the mission cannot
  be fulfilled.
