name: authorizationParent
description: Controlled authorization test parent; outside the ordinary business workflow.
model: reasoning
thinking_level: medium
rbac_roles:
- ASSESS_EQUIPMENT
planning_mode: true
max_steps: 3
allowed_skills:
- name: authorizationNested
  required: true
  max_tasks: 1
input_schema:
  type: object
  properties:
    caseId:
      type: string
    approval:
      type: object
      description: Explicit caller approval bound to one immutable assessment and
        issued quote. Identity and spending authority are verified independently.
      properties:
        assessmentVersion:
          type: string
        option:
          type: string
        quoteId:
          type: string
        attendance:
          type: string
        scope:
          type: object
          properties:
            parts:
              type: array
              items:
                type: string
            onlyIfJustifiedByTechnician:
              type: boolean
            repairHours:
              type: integer
          required:
          - parts
          - onlyIfJustifiedByTechnician
          - repairHours
          additionalProperties: false
        cap:
          type: integer
          description: Approved maximum in USD cents; must match the issued quote
            and caller ceiling.
        idempotencyKey:
          type: string
        approved:
          type: boolean
      required:
      - assessmentVersion
      - option
      - quoteId
      - attendance
      - scope
      - cap
      - idempotencyKey
      - approved
      additionalProperties: false
  required:
  - caseId
  - approval
  additionalProperties: false
prompt: Controlled authorization scenario. Delegate the supplied input unchanged to
  authorizationNested. Preserve verified caller authority. Return its result unchanged.
