name: authorizationParent
description: Controlled authorization test parent; outside the ordinary business workflow.
model: reasoning
thinking_level: medium
rbac_roles: [ASSESS_EQUIPMENT]
planning_mode: true
max_steps: 3
allowed_skills:
  - name: authorizationNested
    required: true
    max_tasks: 1
input_schema:
  type: object
  properties:
    caseId: {type: string}
    approval: {type: object, additionalProperties: true}
  required: [caseId, approval]
prompt: 'Controlled authorization scenario. Delegate the supplied input unchanged to authorizationNested. Preserve verified caller authority. Return its result unchanged.'
