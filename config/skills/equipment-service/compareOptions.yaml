        feasibility:
          type: object
          properties:
            expedited:
              type: object
              properties:
                arrivalWindow:
                  type: string
                  description: Supplied arrival/delivery window or lead time, with
                    date/timezone where available; state unknown if absent.
                completionWindow:
                  type: string
                  description: Interpret timing labels with the offered scope, or
                    calculate arrival plus supplied elapsed duration. State any ambiguity
                    between arrival and setup completion for provider clarification.
                    If completion is not established, identify missing evidence. Completion
                    is not guaranteed restoration.
                accessCondition:
                  type: string
                  description: 'Access through this offer''s entire work/setup period:
                    confirmed sufficiency, necessary arrangements, or missing evidence.
                    Calculate available time only for established activity dates;
                    recurring opening hours alone do not date the work.'
                productionFit:
                  type: string
                  description: This option's timing and capacity relative to the operating
                    need, with assumptions and limits. Comparison evaluates combinations.
                expiryCondition:
                  type: string
                  description: Action required before the bound offerExpiresAt deadline;
                    distinguish price preservation from booking and decisions that
                    cannot await diagnosis.
                approvalCondition:
                  type: string
                  description: Service commitment approval for the quoted scope and
                    cap, using verified identity and site permissions. A recorded
                    ceiling is not approval; pending coverage does not prevent cap
                    approval.
                unresolved:
                  type: array
                  items:
                    type: string
                  description: Unresolved prerequisites or unknowns for this offer,
                    with responsible roles where evidenced. Refer other-option questions
                    to their assessments/comparison; do not present locally absent
                    information as a case-wide unknown.
                citations:
                  type: array
                  items:
                    type: string
                  description: Actual supplied source identifiers supporting the findings.
                offerExpiresAt:
                  type: string
                  description: Authoritative expiry copied by Framework; interpretation
                    belongs in expiryCondition.
                offerReserved:
                  type: boolean
                  description: Authoritative reservation state copied by Framework.
                offerSourceId:
                  type: string
                  description: Authoritative offer snapshot identifier copied by Framework.
                chargeCondition:
                  type: string
                  description: Included services, unconditional or attendance-triggered
                    charges, and conditional repairs for this service offer. Distinguish
                    elapsed visit time from billable repair labor, cap and actual
                    charges; included activities can contribute elapsed time without
                    using the repair-labor allowance. Do not double-count included
                    charges. State missing terms explicitly.
                scopeChangeCondition:
                  type: string
                  description: Apply source terms for renewed approval when attendance,
                    repair scope or cap changes and a new quote before work beyond
