                    type: string
                  revision:
                    type: string
                  name:
                    type: string
                  responsibility:
                    type: string
                  email:
                    type: string
                  hours:
                    type: string
                required:
                - id
                - revision
                - responsibility
                - email
                additionalProperties: false
              description: Supplied contact records copied unchanged by Framework.
                References identify records, not proof of permission or approval.
