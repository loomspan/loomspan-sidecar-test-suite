          items:
            type: object
            properties:
              quoteId:
                type: string
              option:
                type: string
              currency:
                type: string
              maxExposure:
                type: integer
              fullyCoveredScopeMaximum:
                type: integer
              coverage:
                type: string
              attendance:
                type: string
                description: Offered technician arrival window, copied unchanged from
                  this service option's source arrival. It does not specify visit
                  end, elapsed work duration or restored production; dispatch confirmation
                  is separate.
              scope:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      type: string
                  onlyIfJustifiedByTechnician:
                    type: boolean
                  repairHours:
                    type: integer
