                no personal names.
            coverageReviewerSourceIds:
              type: array
              items:
                type: string
              description: IDs of supplied contact records whose recorded responsibility
                owns coverage review. Empty if no matching record; do not borrow identity
                fields from dispatch or another record.
            ownerDirectory:
              type: array
              items:
                type: object
                properties:
