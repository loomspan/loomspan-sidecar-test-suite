                - onlyIfJustifiedByTechnician
                - repairHours
                additionalProperties: false
              expiresAt:
                type: string
              reservation:
                type: boolean
              restorationGuaranteed:
                type: boolean
              priceBreakdown:
                type: object
                properties:
                  rateSourceId:
                    type: string
                  rateSourceRevision:
                    type: string
                  repairLabor:
                    type: object
                    properties:
                      hours:
                        type: integer
                      hourlyRate:
                        type: integer
                      maximum:
                        type: integer
                    required:
                    - hours
                    - hourlyRate
                    - maximum
                    additionalProperties: false
                    description: Quoted repair-labor allowance and its maximum before
                      coverage; hours are billable repair scope, not elapsed visit
                      duration.
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        partId:
                          type: string
                        description:
                          type: string
                        amount:
                          type: integer
                      required:
                      - partId
                      - description
                      - amount
                      additionalProperties: false
                      description: One scoped part and its quoted amount before coverage;
                        charge only if technician-justified.
                  attendancePremium:
                    type: integer
                required:
                - rateSourceId
                - rateSourceRevision
                - repairLabor
                - parts
                - attendancePremium
                additionalProperties: false
                description: Authoritative calculation of this quote in integer USD
                  cents. Labor maximum plus listed parts plus attendance premium equals
                  maxExposure. Repair labor and parts remain conditional on justified
                  work and coverage; this is not an invoice. Diagnosis and travel
                  are included, not additional charges.
            required:
            - quoteId
            - option
            - currency
            - maxExposure
            - fullyCoveredScopeMaximum
            - coverage
            - attendance
            - scope
            - expiresAt
            - reservation
            - restorationGuaranteed
            - priceBreakdown
            additionalProperties: false
          description: All complete quoteOptions quotes unchanged; do not put unquoted
            candidates here.
        entitlementDetermination:
          type: object
          description: Copy the determination field from the entitlements tool result
            envelope unchanged. This is the deterministic coverage evaluation, separate
