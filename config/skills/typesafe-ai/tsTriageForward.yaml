name: tsTriageForward
description: Coordinate contact triage and preserve its judgments.
model: coordination
thinking_level: medium
planning_mode: true
max_steps: 1
prompt: Have tsTriageFixed assess the supplied contact. Do not route tickets or take
  customer actions.
input_schema:
  type: object
  properties:
    context:
      type: object
      additionalProperties: true
  required:
  - context
  additionalProperties: false
allowed_skills:
- name: tsTriageFixed
  required: true
  max_tasks: 1
  input_bindings:
    /context:
      from: input
      path: /context
output_from:
  skill: tsTriageFixed
