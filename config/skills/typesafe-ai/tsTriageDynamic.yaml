name: tsTriageDynamic
description: Evaluate support-contact judgments; no ticket routing or customer action.
executor: typesafe
input_schema:
  type: object
  properties:
    context:
      type: object
      additionalProperties: true
    candidates:
      type: object
      additionalProperties: true
    noulCriteria:
      type: object
      additionalProperties: true
    parameters:
      type: object
      additionalProperties: true
  required:
  - context
  - candidates
  - noulCriteria
  - parameters
  additionalProperties: false
input_transform:
  language: jslt
  expression: |
    {
      "model": "jev-1.13.0",
      "state": .context,
      "questions": {
        "department": {"type": "choice", "instructions": "Which support team should review this contact?", "criteria": .candidates},
        "repeat": {"type": "noul", "instructions": "Does the customer describe a previous support attempt?", "criteria": .noulCriteria},
        "impact": {"type": "score", "instructions": "Rate the reported loss of functionality.", "criteria": .parameters.levels}
      }
    }
