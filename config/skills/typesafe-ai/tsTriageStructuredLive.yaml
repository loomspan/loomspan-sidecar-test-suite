name: tsTriageStructuredLive
description: Evaluate support-contact judgments; no ticket routing or customer action.
model: typesafeTriage
input_schema:
  type: object
  properties:
    context:
      type: object
      additionalProperties: true
    policy:
      type: object
      additionalProperties: true
    candidates:
      type: object
      additionalProperties: true
    parameters:
      type: object
      additionalProperties: true
  required:
  - context
  - policy
  - candidates
  - parameters
  additionalProperties: false
typesafe:
  state: ${/input/context}
  questions:
    department:
      type: choice
      instructions:
        question: Which support team should review this contact?
        policy: ${/input/policy}
      criteria: ${/input/candidates}
    repeat:
      type: noul
      instructions:
      - Does the contact describe a previous support attempt?
      - Consider only the supplied contact and its history.
      criteria:
        'true': Previous support attempt is described
        'false': No previous attempt is described
    impact:
      type: score
      instructions:
        question: Rate the reported loss of functionality.
        guidance: Do not infer detailed symptoms absent from the contact.
      criteria: ${/input/parameters/levels}
