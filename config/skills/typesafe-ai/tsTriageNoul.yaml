name: tsTriageNoul
description: Evaluate support-contact judgments; no ticket routing or customer action.
executor: typesafe
input_schema:
  type: object
  properties:
    context:
      type: object
      additionalProperties: true
  required:
  - context
  additionalProperties: false
input_transform:
  language: jslt
  expression: |
    {
      "model": "jev-1.13.0",
      "state": .context,
      "questions": {
        "repeat": {
          "type": "noul",
          "instructions": "Does the customer describe a previous support attempt?"
        }
      }
    }
