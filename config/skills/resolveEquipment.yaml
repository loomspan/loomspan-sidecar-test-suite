                belongs in expiryCondition.
            offerReserved:
              type: boolean
              description: Authoritative reservation state copied by Framework.
            offerSourceId:
              type: string
              description: Authoritative offer snapshot identifier copied by Framework.
            chargeCondition:
              type: string
              description: Included services, unconditional or attendance-triggered
                charges, and conditional repairs for this service offer. Distinguish
                elapsed visit time from billable repair labor, cap and actual charges;
                included activities can contribute elapsed time without using the
                repair-labor allowance. Do not double-count included charges. State
                missing terms explicitly.
            scopeChangeCondition:
              type: string
              description: Apply source terms for renewed approval when attendance,
                repair scope or cap changes and a new quote before work beyond approved
                scope or cap. A longer elapsed-work estimate alone does not establish
                additional repair scope; identify the changed work or leave the overrun
                unknown. Explicitly state if no rule is supplied.
            coverageReviewCondition:
              type: string
              description: How findings determine coverage and how incomplete/disputed
                findings remain pending review. Refer to coverageReviewerSourceIds
                for the owner; do not invent a personal name.
            dispatchOwnerSourceIds:
              type: array
              items:
                type: string
              description: IDs of supplied contact records whose recorded responsibility
                owns dispatch/resource confirmation. Empty if no matching record;
                no personal names.
            coverageReviewerSourceIds:
              type: array
              items:
                type: string
              description: IDs of supplied contact records whose recorded responsibility
                owns coverage review. Empty if no matching record; do not borrow identity
                fields from dispatch or another record.
            ownerDirectory:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  revision:
                    type: string
                  name:
                    type: string
                  responsibility:
                    type: string
                  email:
                    type: string
                  hours:
                    type: string
                required:
                - id
                - revision
                - responsibility
                - email
                additionalProperties: false
              description: Supplied contact records copied unchanged by Framework.
                References identify records, not proof of permission or approval.
          required:
