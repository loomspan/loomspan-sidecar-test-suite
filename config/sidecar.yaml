spring:
  profiles:
    active: typesafe
loomspan-sidecar:
  configuration:
    mode: file
  trust:
    mode: file
    file:
      jwks: /trust/jwks.json
  auth:
    jwt:
      audience: equipment-service
  executions:
    diagnostics: ALWAYS
loomspan:
  executor-config:
    default:
      typesafe:
        base_url: http://fixtures:8080/typesafe/sidecar/api
        api_key: fixture-typesafe-transport
      http:
        targets:
          equipment:
            base-url: http://python:8080
            auth:
              mode: caller-passthrough
            connect-timeout: 5s
            read-timeout: 240s
            max-response-size: 1MB
  connections:
    model:
      driver: openai
      base-url: http://fixtures:8080/model/sidecar/v1
      api-key: fixture-transport-not-a-provider-secret
      provider-retry:
        max-attempts: 1
  models:
    reasoning:
      connection: model
      provider-model: gpt-6-sol
      thinking-levels:
      - medium
    coordination:
      connection: model
      provider-model: gpt-6-luna
      thinking-levels:
      - medium
  skills:
    locations:
    - file:/config/skills/*/*.yaml
    - file:/config/executor-skills/*/*.yaml
  session:
    mission-timeout: 600s
    quotas:
      max-usage-units: 400000
  execution-trace:
    persistence: ALWAYS
  observability:
    enabled: true
    auth:
      api-key: ${OBSERVER_KEY}
