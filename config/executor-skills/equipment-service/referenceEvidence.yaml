name: referenceEvidence
description: Retrieve applicable manufacturer manual and bulletin passages.
executor: http
config:
  target: equipment
  method: POST
  path: /skills/referenceEvidence
  body:
    source: input
rbac_roles:
- ASSESS_EQUIPMENT
input_schema:
  type: object
  properties:
    caseId:
      type: string
      description: Case correlation identifier supplied by the caller.
    assetId:
      type: string
      description: Registered asset identifier; does not grant caller authority.
  required:
  - caseId
  - assetId
  additionalProperties: false
