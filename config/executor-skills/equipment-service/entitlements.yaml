name: entitlements
description: Evaluate date eligibility and documented findings; model hypotheses are
  not findings.
executor: http
config:
  target: equipment
  method: POST
  path: /skills/entitlements
  body:
    source: input
rbac_roles:
- ASSESS_EQUIPMENT
input_schema:
  type: object
  properties:
    caseId:
      type: string
      description: Case correlation identifier supplied by the caller.
    assetId:
      type: string
      description: Registered asset identifier; does not grant caller authority.
  required:
  - caseId
  - assetId
  additionalProperties: false
