server:
  port: 8080
equipment:
  issuer: http://localhost:18080/realms/equipment
  jwks: http://keycloak:8080/realms/equipment/protocol/openid-connect/certs
  fixtures: http://fixtures:8080
spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
loomspan:
  connections:
    model:
      driver: openai
      base-url: http://fixtures:8080/model/java/v1
      api-key: fixture-transport-not-a-provider-secret
      openai:
        compatibility-profile: openrouter
      provider-retry:
        max-attempts: 1
  models:
    reasoning:
      connection: model
      provider-model: meta/muse-spark-1.3-contributor
      thinking-levels: [medium]
  skills:
    locations: [file:/config/skills/*.yaml]
  session:
    mission-timeout: 600s
  execution-trace:
    persistence: ALWAYS
  observability:
    enabled: true
    auth:
      api-key: ${OBSERVER_KEY}
