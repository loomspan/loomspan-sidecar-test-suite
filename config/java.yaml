server:
  port: 8080
equipment:
  issuer: http://localhost:18080/realms/equipment
  jwks: http://keycloak:8080/realms/equipment/protocol/openid-connect/certs
  fixtures: http://fixtures:8080
spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
loomspan:
  connections:
    model:
      driver: openai
      base-url: http://fixtures:8080/model/java/v1
      api-key: fixture-transport-not-a-provider-secret
      openai:
        compatibility-profile: openrouter
      provider-retry:
        max-attempts: 1
    typesafeTriage:
      driver: typesafe
      base-url: http://fixtures:8080/typesafe/java
      api-key: fixture-typesafe-transport
      request-timeout: 5s
      provider-retry:
        max-attempts: 1
    typesafeTriageRouter:
      driver: typesafe
      base-url: http://fixtures:8080/typesafe/java/api
      api-key: fixture-typesafe-transport
      request-timeout: 5s
      provider-retry:
        max-attempts: 1
    typesafeTriageRetry:
      driver: typesafe
      base-url: http://fixtures:8080/typesafe/java
      api-key: fixture-typesafe-transport
      request-timeout: 5s
      provider-retry:
        max-attempts: 3
    typesafeTriageTimeout:
      driver: typesafe
      base-url: http://fixtures:8080/typesafe/java
      api-key: fixture-typesafe-transport
      request-timeout: 500ms
      provider-retry:
        max-attempts: 1
  models:
    reasoning:
      connection: model
      provider-model: openai/gpt-6-sol
      thinking-levels:
      - medium
    coordination:
      connection: model
      provider-model: openai/gpt-6-luna
      thinking-levels:
      - medium
    typesafeTriage:
      connection: typesafeTriage
      provider-model: jev-1.13.0
    typesafeTriageRouter:
      connection: typesafeTriageRouter
      provider-model: jev-1.13.0
    typesafeTriageRetry:
      connection: typesafeTriageRetry
      provider-model: jev-1.13.0
    typesafeTriageTimeout:
      connection: typesafeTriageTimeout
      provider-model: jev-1.13.0
  skills:
    locations:
    - file:/config/skills/*/*.yaml
  session:
    mission-timeout: 600s
    quotas:
      max-usage-units: 400000
  execution-trace:
    persistence: ALWAYS
  observability:
    enabled: true
    auth:
      api-key: ${OBSERVER_KEY}
