              - revision
              - currency
              - monetaryUnit
              - luisMaximumCustomerExposure
              - mayaMayCommit
              - largerCommitments
              - permissionBoundary
              additionalProperties: false
            contacts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  revision:
                    type: string
                  name:
                    type: string
                  responsibility:
                    type: string
                  email:
                    type: string
                  hours:
                    type: string
                required:
                - id
                - revision
                - responsibility
                - email
                additionalProperties: false
          required:
          - id
          - revision
          - issuer
          - assetId
          - serial
          - manufacturer
          - model
          - hardwareRevision
          - commissioned
          - owner
          - site
          - approvalContext
          - contacts
          additionalProperties: false
          description: Complete original assetContext data; preserve all returned
            records, fields and values, including optional source metadata. Use the
            data value, not its transport envelope.
        serviceHistory:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              revision:
                type: string
              date:
                type: string
              author:
                type: string
              observation:
                type: string
            required:
            - id
            - revision
            - date
            - author
            - observation
            additionalProperties: false
          description: Complete original serviceHistory data; preserve all returned
            records, fields and values, including optional source metadata. Use the
            data value, not its transport envelope.
        referenceEvidence:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              revision:
                type: string
              issuer:
                type: string
              text:
                type: string
              applicability:
                type: object
                properties:
                  manufacturer:
                    type: string
                  model:
                    type: string
                  hardwareRevision:
                    type: string
                  serialRangeInclusive:
                    type: array
                    items:
                      type: string
                required:
                - manufacturer
                - model
                - hardwareRevision
                additionalProperties: false
            required:
            - id
            - revision
            - issuer
            - text
            - applicability
            additionalProperties: false
          description: Complete original referenceEvidence data; preserve all returned
            records, fields and values, including optional source metadata. Use the
            data value, not its transport envelope.
        serviceTerms:
          type: object
          properties:
            clauses:
              type: array
              items:
