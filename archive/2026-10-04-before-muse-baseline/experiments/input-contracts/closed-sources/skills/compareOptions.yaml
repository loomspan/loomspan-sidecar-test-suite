                - id
                - revision
                - text
                additionalProperties: false
            certificate:
              type: object
              properties:
                id:
                  type: string
                revision:
                  type: string
                start:
                  type: string
                endExclusive:
                  type: string
                serial:
                  type: string
              required:
              - id
              - revision
              - start
              - endExclusive
              - serial
              additionalProperties: false
            agreement:
              type: object
              properties:
                id:
                  type: string
                revision:
                  type: string
                start:
                  type: string
                endExclusive:
                  type: string
                diagnosisIncluded:
                  type: boolean
                travelIncluded:
                  type: boolean
                assetId:
                  type: string
                siteId:
                  type: string
              required:
              - id
              - revision
              - start
              - endExclusive
              - diagnosisIncluded
              - travelIncluded
              - assetId
              - siteId
              additionalProperties: false
            rates:
              type: object
              properties:
                id:
                  type: string
                revision:
                  type: string
                currency:
                  type: string
                diagnosis:
                  type: integer
                travel:
                  type: integer
                repairHourly:
                  type: integer
                sensor:
                  type: integer
                connector:
                  type: integer
                expedited:
                  type: integer
                monetaryUnit:
                  type: string
              required:
              - id
              - revision
              - currency
              - diagnosis
              - travel
              - repairHourly
              - sensor
              - connector
              - expedited
              - monetaryUnit
              additionalProperties: false
          required:
          - clauses
          - certificate
          - agreement
          - rates
          additionalProperties: false
          description: Complete original serviceTerms data; preserve all returned
            records, fields and values, including optional source metadata. Use the
            data value, not its transport envelope.
        operatingNeeds:
          type: object
          properties:
            incident:
              type: string
            productionStart:
              type: string
            recoverableDelayHours:
              type: integer
            lostMorningShift:
              type: string
            minimumCapacityPerMinute:
              type: integer
            restorationRiskPreference:
              type: string
            siteAccess:
              type: string
            businessNow:
              type: string
          required:
          - incident
          - productionStart
          - recoverableDelayHours
          - lostMorningShift
          - minimumCapacityPerMinute
          - restorationRiskPreference
          - siteAccess
          - businessNow
          additionalProperties: false
          description: Original mission context, including incident, operating priorities,
            site access and business time; preserve supplied values.
        entitlements:
          type: object
          properties:
            id:
              type: string
            revision:
              type: string
            findings:
              type: array
              items:
                type: object
                additionalProperties: true
            maintenanceRecordAvailable:
              type: boolean
          required:
          - id
          - revision
          - findings
          - maintenanceRecordAvailable
          additionalProperties: false
          description: Complete original entitlements data; preserve all returned
            records, fields and values, including optional source metadata. Use the
            data value, not its transport envelope.
        serviceResources:
          type: object
          properties:
            id:
              type: string
            revision:
              type: string
            observedAt:
              type: string
            expiresAt:
              type: string
            parts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  quantity:
                    type: integer
                  revision:
                    type: string
                required:
