name: compareOptions
description: Compare checked options and own the final cited recommendation.
model: reasoning
thinking_level: medium
rbac_roles:
- ASSESS_EQUIPMENT
input_schema:
  type: object
  properties:
    caseId:
      type: string
    assetId:
      type: string
    context:
      type: object
      properties:
        equipmentAssessment:
          type: object
          properties:
            caseId:
              type: string
            assetId:
              type: string
            chronology:
              type: array
              items:
                type: string
            hypotheses:
              type: array
              items:
                type: object
                properties:
                  explanation:
                    type: string
                  supporting:
                    type: array
                    items:
                      type: string
                  contrary:
                    type: array
                    items:
                      type: string
                required:
                - explanation
                - supporting
                - contrary
                additionalProperties: false
            uncertainty:
              type: array
              items:
                type: string
            questions:
              type: array
              items:
                type: string
            citations:
              type: array
              items:
                type: string
          required:
          - caseId
          - assetId
          - chronology
          - hypotheses
          - uncertainty
          - questions
          - citations
          additionalProperties: false
          description: Complete unchanged assessEquipment result, including ordered
            arrays and original citations.
        assetContext:
          type: object
          properties:
            id:
              type: string
            revision:
              type: string
            issuer:
              type: string
            assetId:
              type: string
            serial:
              type: string
            manufacturer:
              type: string
            model:
              type: string
            hardwareRevision:
              type: string
            commissioned:
              type: string
            owner:
              type: string
            site:
              type: object
              properties:
                id:
                  type: string
                revision:
                  type: string
                siteId:
                  type: string
                timezone:
                  type: string
                access:
                  type: string
