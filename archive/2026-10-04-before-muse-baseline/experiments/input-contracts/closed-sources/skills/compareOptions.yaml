              - id
              - revision
              - siteId
              - timezone
              - access
              additionalProperties: false
            approvalContext:
              type: object
              properties:
                id:
                  type: string
                revision:
                  type: string
                currency:
                  type: string
                monetaryUnit:
                  type: string
                luisMaximumCustomerExposure:
                  type: integer
                mayaMayCommit:
                  type: boolean
                largerCommitments:
                  type: string
                permissionBoundary:
                  type: string
